<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HX - TPS Optimization</title>
    <style>
        /* CSS - Tạo bộ mặt cho thương hiệu HX */
        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #0a0a0a;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }

        .container {
            text-align: center;
            background: rgba(20, 20, 20, 0.8);
            padding: 50px;
            border-radius: 20px;
            border: 1px solid #ffcc00;
            box-shadow: 0 0 30px rgba(255, 204, 0, 0.2);
            backdrop-filter: blur(10px);
        }

        h1 {
            font-size: 3rem;
            margin-bottom: 10px;
            background: linear-gradient(90deg, #ffcc00, #ffffff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-transform: uppercase;
        }

        p {
            font-size: 1.2rem;
            color: #cccccc;
            margin-bottom: 30px;
        }

        .tps-status {
            font-family: 'Courier New', Courier, monospace;
            color: #00ff00;
            margin-bottom: 20px;
            font-weight: bold;
        }

        .btn-discord {
            display: inline-block;
            padding: 15px 40px;
            background: #5865F2;
            color: white;
            text-decoration: none;
            font-weight: bold;
            border-radius: 50px;
            transition: 0.3s;
            box-shadow: 0 5px 15px rgba(88, 101, 242, 0.4);
        }

        .btn-discord:hover {
            transform: scale(1.1);
            background: #4752c4;
            box-shadow: 0 8px 25px rgba(88, 101, 242, 0.6);
        }

        .footer {
            margin-top: 30px;
            font-size: 0.8rem;
            color: #555;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>HX - OPTIMIZATION</h1>
        <p>Pháp Sư Tối Ưu Server Minecraft</p>
        
        <div class="tps-status">
            Current Server Status: <span id="tps-val">20.0</span> TPS
        </div>

        <a href="https://discord.gg/skZFptwdPQ" class="btn-discord">Gia Nhập Discord HX-TPS</a>

        <div class="footer">
            IP: HX.name.vn | Powered by HX - TPS Optimization
        </div>
    </div>

    <script>
        // JavaScript - Tạo chút hiệu ứng nhảy số TPS cho nó chân thực
        setInterval(() => {
            const tpsElement = document.getElementById('tps-val');
            // Thỉnh thoảng cho nó nhảy xuống 19.99 rồi lên lại 20.0 cho uy tín
            const fakeTPS = (19.98 + Math.random() * 0.02).toFixed(2);
            tpsElement.innerText = fakeTPS;
        }, 3000);
    </script>

</body>
</html>
